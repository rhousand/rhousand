name: Metrics
on:
  schedule: [{cron: "0 6 * * *"}]
  push: {branches: ["main"]}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: rhousand
          template: classic
          base: header, activity, community, repositories
          config_animations: yes
          config_timezone: America/New_York
          use_prebuilt_image: yes

          # plugin_achievements disabled: its GraphQL query still requests
          # user.projects (Projects classic), which GitHub sunset, nulling the
          # whole response. Upstream lowlighter/metrics#1706; re-enable once a
          # ProjectsV2 migration ships.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_lines: yes
          plugin_repositories: yes
          plugin_repositories_featured: rhousand/output-monitor, rhousand/sailboatdata-recon, rhousand/nixfiles
          plugin_traffic: yes
